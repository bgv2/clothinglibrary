{% extends "base.html" %}

{% block content %}
<div class="container">
    <h1>Add Item</h1>
    <form method="POST">
      {% csrf_token %}
      {{ form.non_field_errors }}
      {% for field in form %}
          <div class="form-group">
              <label for="{{ field.id_for_label }}">{{ field.label }}</label>
              {{ field }}
              <div class="text-danger">{{ field.errors }}</div>
          </div>
      {% endfor %}
      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
{% endblock %}
