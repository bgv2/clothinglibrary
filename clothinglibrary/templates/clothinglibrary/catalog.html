{% extends "base.html" %}

{% block content %}
    <h1>CATALOG</h1>
    {% for item in items %}
        <div class="item" style="border: 1px solid black; padding: 10px; margin: 10px;">
            <h2>{{ item.name }}</h2>
            <p>{{ item.get_condition_display }}</p>
        </div>
    {% endfor %}
{% endblock %}
