{% extends "base.html" %}

{% block content %}
    <h1>CATALOG</h1>
    {% for item in items %}
  <div>
    <h3>{{ item.name }} (ID: {{ item.pk }})</h3>
    {% if item.photos.exists %}
      <!-- Display the first photo or loop all photos -->
      <img src="{{ item.photos.first.photo }}" alt="Photo for {{ item.name }}">
    {% else %}
      <p>No photos uploaded.</p>
    {% endif %}
  </div>
{% endfor %}
{% endblock %}
